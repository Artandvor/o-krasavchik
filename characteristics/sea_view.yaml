key: sea_view
title: Вид на море
group: Вид из окна
description: Видна ли морская гладь из окон — по сторонам здания и этажам.
scope: room            # характеристика номера: зависит от стороны фасада и этажа
type: bool
tool: viewshed
params: {target: sea, min_prob: 0.6}
sources: ["Copernicus DEM GLO-30", "OpenStreetMap: здания и береговая линия"]
ttl_days: 365          # пересчёт раз в год или при изменении застройки рядом
trust: {geo: 0.8, hotelier: 0.85, osm_tag: 0.4}
demand: 0.45
hotelier:
  ask_below: 0.75
  question: "Из каких номеров видно море? Укажите сторону здания и этажи."
  hypothesis: "По расчёту видимости море видно {summary}. Это так?"
  fields: {value: bool, from_floor: int, sides: list}
search:
  synonyms: ["вид на море", "видом на море", "море из окна", "морем из окна", "окна на море", "sea view", "видно море", "панорам", "над морем", "шум моря", "шумом моря", "садится в море", "в воду", "видеть море", "увидеть море", "море видно", "смотреть на море", "морской вид", "красивый вид", "красивым видом", "видом на воду"]
  desired: true
