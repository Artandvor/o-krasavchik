services:
  app:
    build:
      context: .
      target: runtime
    image: odin-shag:1.0
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # Пересборка демо-данных из открытых источников (не стартует по умолчанию):
  #   docker compose --profile pipeline run --rm pipeline
  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      target: pipeline
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./config:/app/config
